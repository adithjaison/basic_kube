apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-grpc
  namespace: basic-kube
  labels:
    app.kubernetes.io/name: hello-grpc
    app.kubernetes.io/part-of: basic-kube
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-grpc
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
