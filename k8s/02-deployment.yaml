apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-grpc
  namespace: basic-kube
  labels:
    app.kubernetes.io/name: hello-grpc
    app.kubernetes.io/part-of: basic-kube
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-grpc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-grpc
        app.kubernetes.io/part-of: basic-kube
    spec:
      containers:
        - name: hello-grpc
          image: docker-basic_kube:latest
          imagePullPolicy: Never
          command: ["/scripts/start_prod_server.sh"]
          envFrom:
            - configMapRef:
                name: hello-grpc-config
            - secretRef:
                name: hello-grpc-secret
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
